<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0e1116" />
    <meta
      name="description"
      content="Descubra seu IP público IPv4 e IPv6 grátis, com um clique para copiar. Acesse também consulta DNS e calculadora CIDR. Ferramentas de rede da Argonauts."
    />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <title>
      Qual é meu IP? Descubra seu IP público IPv4 e IPv6 | Argonauts
    </title>
    <link rel="canonical" href="https://publicip.argonauts.com.br/" />
    <link rel="icon" type="image/png" href="/brands/publicip/logo.png" />
    <link rel="describedby" type="text/markdown" href="/llms.txt" />
    <link rel="alternate" type="text/markdown" href="/docs/ip-publico.md" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="PublicIp" />
    <meta
      property="og:title"
      content="Qual é meu IP? IPv4 e IPv6 em segundos"
    />
    <meta
      property="og:description"
      content="Descubra e copie seu IP público. Ferramentas gratuitas de rede, DNS e sub-redes."
    />
    <meta property="og:url" content="https://publicip.argonauts.com.br/" />
    <meta property="og:image" content="https://publicip.argonauts.com.br/brands/publicip/logo.png" />
    <meta property="og:image:alt" content="PublicIp" />
    <meta name="twitter:card" content="summary" />
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://publicip.argonauts.com.br/#site",
            "name": "PublicIp",
            "url": "https://publicip.argonauts.com.br/",
            "inLanguage": "pt-BR",
            "publisher": {
              "@type": "Organization",
              "name": "Argonauts",
              "url": "https://argonauts.com.br/"
            }
          },
          {
            "@type": "WebApplication",
            "@id": "https://publicip.argonauts.com.br/#app",
            "name": "Qual é meu IP?",
            "url": "https://publicip.argonauts.com.br/",
            "description": "Ferramenta gratuita para consultar o endereço IP público IPv4 e IPv6 do visitante.",
            "applicationCategory": "UtilitiesApplication",
            "operatingSystem": "Qualquer sistema com navegador moderno",
            "inLanguage": "pt-BR",
            "isAccessibleForFree": true,
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "BRL" }
          }
        ]
      }
    </script>
    <script type="module" src="/src/ip.js"></script>
  </head>
  <body class="home-page">
    <a class="skip-link" href="#conteudo">Pular para conteúdo</a>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="/" aria-label="Argonauts Public IP — início"
          ><img
            class="brand-logo"
            src="/brands/publicip/logo.png"
            width="40"
            height="40"
            alt=""
            decoding="async"
          /><span
            >argonauts <span class="brand-divider">/</span>
            <strong>Public IP</strong></span
          ></a
        >
        <nav class="primary-nav" aria-label="Navegação principal">
          <a href="/" aria-current="page" aria-label="Meu IP">IP</a
          ><a href="/dns/" aria-label="Consulta DNS">DNS</a
          ><a href="/cidr/" aria-label="Calculadora CIDR">CIDR</a>
        </nav>
      </div>
    </header>
    <main id="conteudo" class="container home-main">
      <section class="ip-hero floating-card" aria-labelledby="ip-heading">
        <h1 id="ip-heading">Seu IP público</h1>
        <div id="ip-result" class="ip-result is-loading">
          <output id="primary-ip" class="ip-value" aria-live="polite">—</output>
        </div>
        <div class="ip-controls">
          <div
            id="protocol-switch"
            class="protocol-switch"
            role="group"
            aria-label="Protocolo do endereço exibido"
            hidden
          >
            <button id="select-ipv4" type="button" aria-pressed="false">
              IPv4</button
            ><button id="select-ipv6" type="button" aria-pressed="false">
              IPv6
            </button>
          </div>
          <span id="protocol-single" class="protocol-label" hidden></span>
          <button
            id="refresh-ip"
            type="button"
            class="text-button refresh-button"
          >
            <i data-lucide="rotate-cw" aria-hidden="true"></i
            ><span>Atualizar</span>
          </button>
        </div>
        <button
          id="copy-ip"
          type="button"
          class="button button-copy copy-button ip-copy"
          aria-label="Copiar IP"
          title="Copiar IP"
          disabled
        >
          <span class="icon-default"
            ><i data-lucide="copy" aria-hidden="true"></i></span
          ><span class="icon-success"
            ><i data-lucide="check" aria-hidden="true"></i
          ></span>
          <span data-copy-label>Copiar IP</span>
        </button>
        <p id="ip-feedback" class="status" role="status" aria-live="polite"></p>
        <noscript
          ><p class="status">
            Ative o JavaScript para consultar seu IP.
          </p></noscript
        >
      </section>
      <nav class="tool-shortcuts" aria-label="Outras ferramentas">
        <a class="floating-card" href="/dns/"
          ><i data-lucide="network" aria-hidden="true"></i
          ><span>Consulta DNS</span
          ><i data-lucide="arrow-up-right" aria-hidden="true"></i
        ></a>
        <a class="floating-card" href="/cidr/"
          ><i data-lucide="calculator" aria-hidden="true"></i
          ><span>Calculadora CIDR</span
          ><i data-lucide="arrow-up-right" aria-hidden="true"></i
        ></a>
      </nav>
    </main>
    <footer class="site-footer">
      <div class="container footer-inner">
        <span class="powered-by"
          >Powered by
          <a
            href="https://argonauts.com.br/"
            target="_blank"
            rel="noopener noreferrer"
            ><img
              src="/brands/argonauts.svg"
              width="26"
              height="25"
              alt=""
              decoding="async"
            /><span>Argonauts Soluções LTDA</span></a
          ></span
        >
        <nav aria-label="Navegação secundária">
          <a href="/guias/">Guias</a><a href="/privacidade/">Privacidade</a
          ><a
            class="source-link"
            href="https://github.com/DanielLemmertz/public-ip"
            aria-label="Código-fonte no GitHub"
            target="_blank"
            rel="noopener noreferrer"
            ><i data-lucide="arrow-up-right" aria-hidden="true"></i
          ></a>
        </nav>
      </div>
    </footer>
  </body>
</html>
